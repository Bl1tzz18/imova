name: CI/CD

# One pipeline per commit.
# - Pull request: CI only — build, tests, Terraform fmt/validate, Docker images built (not pushed).
#   Job names are what the branch protection's required checks refer to — renaming a job means
#   updating those too.
# - Push to main: the same CI, then CD — "Deploy to prod" (once every CI job passed) waits for your
#   approval (the run → Review deployments → Approve and deploy), then pushes the three images to
#   the registry (from the CI build cache), applies Terraform (shared, then prod), moves the apps to
#   the new images and checks the site and the API answer. Only approved commits reach the
#   registry. Not approving is fine: a newer run's deploy cancels an older one still waiting.
# - By hand (Actions → CI/CD → Run workflow, from main): the same as a push, with "what"
#   (everything / app / infrastructure) and "allow_destroy" (a Terraform plan that deletes or
#   replaces something is refused otherwise).
# CD signs in to Azure with GitHub's OIDC token, no stored passwords, as "imova-github-deploy"
# (environment "production", behind your approval). One-time setup: infra/scripts/setup-cd.sh
# (infra/README.md, "Deploying from GitHub").
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      what:
        description: What to deploy
        type: choice
        options:
          - everything
          - app
          - infrastructure
        default: everything
      allow_destroy:
        description: Let Terraform delete or replace resources (refused otherwise)
        type: boolean
        default: false

# A new push to a PR cancels that PR's older run. On main every run is on its own (its own group, the
# run id) and always finishes — a run waiting for the deploy approval must never hold up the CI of
# the commits after it; only the deploy job is one-at-a-time (deploy-production, below).
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  DOTNET_NOLOGO: "true"
  DOTNET_CLI_TELEMETRY_OPTOUT: "true"
  ACR_NAME: acrimova
  RESOURCE_GROUP: rg-imova-prod
  SITE_URL: https://imova.md
  API_URL: https://api.imova.md

jobs:
  backend:
    name: Backend (build, unit + architecture tests)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet restore src/backend/Imova.sln
      - run: dotnet build src/backend/Imova.sln --no-restore -c Release
      - name: Unit tests
        run: dotnet test tests/Imova.UnitTests --no-build -c Release --logger trx --results-directory TestResults
      - name: Architecture tests
        run: dotnet test tests/Imova.ArchitectureTests --no-build -c Release --logger trx --results-directory TestResults
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: backend-test-results
          path: TestResults

  integration:
    name: Backend integration tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # Only for the compose Postgres below — a throwaway database on a throwaway runner.
      POSTGRES_USER: imova
      POSTGRES_PASSWORD: imova
      IMOVA_TEST_CONNECTION_STRING: Host=localhost;Port=5432;Database=imova_test;Username=imova;Password=imova
      # Azurite's well-known development account (the same in every install, not a secret) — locally
      # this comes from the gitignored appsettings.Development.json.
      Storage__ConnectionString: DefaultEndpointsProtocol=http;AccountName=devstoreaccount1;AccountKey=Eby8vdM02xNOcqFlqUwJPLlmEtlCDXJ1OUzFT50uSRZ6IFsuFq2UVErCz4I6tq/K1SZFPTOtr/KBHBeksoGMGw==;BlobEndpoint=http://127.0.0.1:10000/devstoreaccount1;
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      # Postgres (PostGIS) and Azurite exactly as compose runs them locally — the media tests PUT
      # real blobs. --wait blocks until both healthchecks pass.
      - name: Start Postgres and Azurite
        run: docker compose up -d --wait postgres azurite
      # Locally the signing key comes from user secrets; here a fresh random one per run.
      - name: JWT signing key
        run: |
          key=$(openssl rand -base64 64 | tr -d '\n')
          echo "::add-mask::$key"
          echo "Jwt__Key=$key" >> "$GITHUB_ENV"
      # Each test class starts its own API host, and each host watches its config files; the
      # runner's default inotify instance limit is too low for that many.
      - run: sudo sysctl -w fs.inotify.max_user_instances=8192
      - run: dotnet restore tests/Imova.IntegrationTests
      - run: dotnet build tests/Imova.IntegrationTests --no-restore -c Release
      - name: Integration tests
        run: dotnet test tests/Imova.IntegrationTests --no-build -c Release --logger trx --results-directory TestResults
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: integration-test-results
          path: TestResults
      - name: Service logs
        if: failure()
        run: docker compose logs postgres azurite

  frontend:
    name: Frontend (typecheck + Vitest)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: src/frontend/imova-web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # Same major as the Dockerfile's node:24-alpine (Node 20 is past end of life, and its
          # npm 10 reads the lock file npm 11 writes as out of sync).
          node-version: 24
          cache: npm
          cache-dependency-path: src/frontend/imova-web/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm test

  # Formatting and validity of every Terraform stack. No Azure access: providers are downloaded,
  # nothing is planned or applied.
  terraform:
    name: Terraform (fmt, validate)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "~1.17"
      - run: terraform fmt -check -recursive -diff
        working-directory: infra
      - name: terraform validate
        working-directory: infra
        run: |
          for stack in bootstrap shared envs/dev envs/prod; do
            echo "::group::$stack"
            terraform -chdir="$stack" init -backend=false -input=false -lockfile=readonly
            terraform -chdir="$stack" validate
            echo "::endgroup::"
          done

  # Catches Dockerfile breakage (a new project not copied in, a failing `next build`, …). Nothing
  # is pushed; layers are cached in the GitHub Actions cache per image — after an approved deploy
  # the same images are pushed straight from that cache.
  docker:
    name: Docker image (${{ matrix.image }})
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: api
            context: .
            dockerfile: src/backend/Imova.Api/Dockerfile
          - image: worker
            context: .
            dockerfile: src/backend/Imova.Worker/Dockerfile
          - image: web
            context: src/frontend/imova-web
            dockerfile: src/frontend/imova-web/Dockerfile
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: false
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}

  # ---- CD (main only) ---------------------------------------------------------------------------

  deploy:
    name: Deploy to prod
    # Once every CI job passed — main only.
    needs: [backend, integration, frontend, terraform, docker]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # Waits here for your approval (the environment's required reviewer).
    environment:
      name: production
      url: https://imova.md
    # One deploy at a time; a newer one waits instead of interrupting it.
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    env:
      WHAT: ${{ inputs.what || 'everything' }}
      ALLOW_DESTROY: ${{ inputs.allow_destroy || false }}
      ARM_USE_OIDC: "true"
      ARM_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
      ARM_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      TF_IN_AUTOMATION: "true"
    steps:
      - uses: actions/checkout@v4
      - name: Image tag
        run: echo "TAG=${GITHUB_SHA::12}" >> "$GITHUB_ENV"
      # Also for Terraform: binding a custom domain runs `az containerapp hostname bind`.
      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      # Only now, after the approval, do the images reach the registry — so it holds only what was
      # (or is about to be) deployed. Built from the Docker check jobs' cache: quick.
      - name: Which images to push
        id: images
        if: env.WHAT != 'infrastructure'
        run: |
          az acr login --name "$ACR_NAME"
          for image in api worker web; do
            if docker manifest inspect "${ACR_NAME}.azurecr.io/imova-$image:$TAG" >/dev/null 2>&1; then
              echo "imova-$image:$TAG is already in the registry — not rebuilt."
            else
              echo "$image=true" >> "$GITHUB_OUTPUT"
            fi
          done
      - uses: docker/setup-buildx-action@v3
        if: env.WHAT != 'infrastructure'
      - name: Image (api)
        if: steps.images.outputs.api == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: src/backend/Imova.Api/Dockerfile
          push: true
          tags: ${{ env.ACR_NAME }}.azurecr.io/imova-api:${{ env.TAG }}
          build-args: APP_VERSION=${{ env.TAG }}
          cache-from: type=gha,scope=api
      - name: Image (worker)
        if: steps.images.outputs.worker == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: src/backend/Imova.Worker/Dockerfile
          push: true
          tags: ${{ env.ACR_NAME }}.azurecr.io/imova-worker:${{ env.TAG }}
          build-args: APP_VERSION=${{ env.TAG }}
          cache-from: type=gha,scope=worker
      - name: Image (web)
        if: steps.images.outputs.web == 'true'
        uses: docker/build-push-action@v6
        with:
          context: src/frontend/imova-web
          file: src/frontend/imova-web/Dockerfile
          push: true
          tags: ${{ env.ACR_NAME }}.azurecr.io/imova-web:${{ env.TAG }}
          build-args: APP_VERSION=${{ env.TAG }}
          cache-from: type=gha,scope=web

      - uses: hashicorp/setup-terraform@v3
        if: env.WHAT != 'app'
        with:
          terraform_version: "~1.17"
          terraform_wrapper: false

      - name: Terraform (shared, then prod)
        if: env.WHAT != 'app'
        working-directory: infra
        run: |
          # The image tag only matters if Terraform creates an app; otherwise the running one stays.
          image_tag="$TAG"
          if [ "$WHAT" = infrastructure ]; then
            image_tag=$(az containerapp show --name imova-api --resource-group "$RESOURCE_GROUP" \
              --query 'properties.template.containers[0].image' -o tsv | sed 's/.*://')
          fi

          for stack in shared envs/prod; do
            backend=$([ "$stack" = shared ] && echo ../backend.hcl || echo ../../backend.hcl)
            vars=()
            [ "$stack" = envs/prod ] && vars=(-var "image_tag=$image_tag")

            echo "::group::$stack: init + plan"
            terraform -chdir="$stack" init -input=false -lockfile=readonly -backend-config="$backend"
            set +e
            terraform -chdir="$stack" plan -input=false -detailed-exitcode -out=tfplan "${vars[@]}"
            code=$?
            set -e
            echo "::endgroup::"
            [ "$code" = 1 ] && { echo "::error::terraform plan failed in $stack"; exit 1; }

            if [ "$code" = 0 ]; then
              echo "### $stack: no changes" >> "$GITHUB_STEP_SUMMARY"
              continue
            fi

            {
              echo "### $stack: changes"
              echo '```'
              terraform -chdir="$stack" show -no-color tfplan | grep -E '^\s*# |^Plan:' || true
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"

            removed=$(terraform -chdir="$stack" show -json tfplan \
              | jq '[.resource_changes[] | select(.change.actions | index("delete"))] | length')
            if [ "$removed" != 0 ] && [ "$ALLOW_DESTROY" != true ]; then
              echo "::error::The $stack plan deletes or replaces $removed resource(s) — see the summary. If that's intended: Actions → CI/CD → Run workflow with \"allow_destroy\" ticked."
              exit 1
            fi

            echo "::group::$stack: apply"
            terraform -chdir="$stack" apply -input=false tfplan
            echo "::endgroup::"
          done

      - name: Point the apps at the new images
        if: env.WHAT != 'infrastructure'
        run: |
          # The way back from a bad migration (some are one-way): a point-in-time restore to just
          # before this release (docs/backup-restore.md). B1ms can't take on-demand backups.
          restore_point=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          {
            echo "### Release $TAG"
            echo "Database restore point before this release: \`$restore_point\` (UTC, restorable for 7 days — docs/backup-restore.md)"
          } >> "$GITHUB_STEP_SUMMARY"
          # The API first: it runs the database migrations the other two may depend on.
          for app in imova-api imova-worker imova-web; do
            echo "Updating $app to $TAG"
            az containerapp update --name "$app" --resource-group "$RESOURCE_GROUP" \
              --image "${ACR_NAME}.azurecr.io/$app:$TAG" --output none
          done

      - name: The site and the API answer
        if: env.WHAT != 'infrastructure'
        run: |
          # Prod may be asleep (scaled to zero): the first request wakes it, so allow a few minutes.
          check() {
            for attempt in $(seq 1 18); do
              status=$(curl -s -o /dev/null -w '%{http_code}' --max-time 30 "$1" || true)
              [ "$status" = 200 ] && { echo "$1 → 200"; return 0; }
              echo "$1 → $status, retrying ($attempt/18)"
              sleep 10
            done
            echo "::error::$1 didn't answer 200. If a migration failed, restore the database to the point above."
            return 1
          }
          check "$API_URL/health/ready"
          check "$SITE_URL/"
          echo "prod runs **$TAG**: $SITE_URL" >> "$GITHUB_STEP_SUMMARY"
