name: CI

# Every PR, and main after a merge. Job names are what the branch protection's required checks
# refer to — renaming a job means updating those too.
on:
  pull_request:
  push:
    branches: [main]

# A new push to a PR cancels that PR's older run; runs on main always finish.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  DOTNET_NOLOGO: "true"
  DOTNET_CLI_TELEMETRY_OPTOUT: "true"

jobs:
  backend:
    name: Backend (build, unit + architecture tests)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet restore src/backend/Imova.sln
      - run: dotnet build src/backend/Imova.sln --no-restore -c Release
      - name: Unit tests
        run: dotnet test tests/Imova.UnitTests --no-build -c Release --logger trx --results-directory TestResults
      - name: Architecture tests
        run: dotnet test tests/Imova.ArchitectureTests --no-build -c Release --logger trx --results-directory TestResults
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: backend-test-results
          path: TestResults

  integration:
    name: Backend integration tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # Only for the compose Postgres below — a throwaway database on a throwaway runner.
      POSTGRES_USER: imova
      POSTGRES_PASSWORD: imova
      IMOVA_TEST_CONNECTION_STRING: Host=localhost;Port=5432;Database=imova_test;Username=imova;Password=imova
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      # Postgres (PostGIS) and Azurite exactly as compose runs them locally — the media tests PUT
      # real blobs. --wait blocks until both healthchecks pass.
      - name: Start Postgres and Azurite
        run: docker compose up -d --wait postgres azurite
      # Locally the signing key comes from user secrets; here a fresh random one per run.
      - name: JWT signing key
        run: |
          key=$(openssl rand -base64 64 | tr -d '\n')
          echo "::add-mask::$key"
          echo "Jwt__Key=$key" >> "$GITHUB_ENV"
      # Each test class starts its own API host, and each host watches its config files; the
      # runner's default inotify instance limit is too low for that many.
      - run: sudo sysctl -w fs.inotify.max_user_instances=8192
      - run: dotnet restore tests/Imova.IntegrationTests
      - run: dotnet build tests/Imova.IntegrationTests --no-restore -c Release
      # TEMPORARY diagnostic (remove once CI is green): why are bearer tokens refused here?
      - name: Diagnose bearer auth
        continue-on-error: true
        env:
          ConnectionStrings__Default: ${{ env.IMOVA_TEST_CONNECTION_STRING }}
          ASPNETCORE_ENVIRONMENT: Development
          ASPNETCORE_URLS: http://127.0.0.1:5080
          Logging__LogLevel__Microsoft.AspNetCore.Authentication: Debug
        run: |
          dotnet run --project src/backend/Imova.Api -c Release --no-launch-profile > api.log 2>&1 &
          for i in $(seq 60); do curl -sf http://127.0.0.1:5080/health >/dev/null && break; sleep 2; done
          token=$(curl -s http://127.0.0.1:5080/api/v1/auth/register -H 'Content-Type: application/json' \
            -d '{"email":"diag-'$RANDOM'@example.com","password":"SuperSecret1!","displayName":"Diag","phoneNumber":"+373 69 123 456"}' \
            | python3 -c 'import json,sys; print(json.load(sys.stdin)["token"])')
          echo "$token" | cut -d. -f2 | tr '_-' '/+' | base64 -d 2>/dev/null; echo
          date -u
          curl -si http://127.0.0.1:5080/api/v1/auth/me -H "Authorization: Bearer $token" | head -15
          kill %1 || true
          grep -i -A3 "authentic\|bearer\|token\|fail\|exception" api.log | head -60
      - name: Integration tests
        run: dotnet test tests/Imova.IntegrationTests --no-build -c Release --logger trx --results-directory TestResults
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: integration-test-results
          path: TestResults
      - name: Service logs
        if: failure()
        run: docker compose logs postgres azurite

  frontend:
    name: Frontend (typecheck + Vitest)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: src/frontend/imova-web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # Same major as the Dockerfile's node:24-alpine (Node 20 is past end of life, and its
          # npm 10 reads the lock file npm 11 writes as out of sync).
          node-version: 24
          cache: npm
          cache-dependency-path: src/frontend/imova-web/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm test

  # Catches Dockerfile breakage (a new project not copied in, a failing `next build`, …). Nothing
  # is pushed; layers are cached in the GitHub Actions cache per image.
  docker:
    name: Docker image (${{ matrix.image }})
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: api
            context: .
            dockerfile: src/backend/Imova.Api/Dockerfile
          - image: worker
            context: .
            dockerfile: src/backend/Imova.Worker/Dockerfile
          - image: web
            context: src/frontend/imova-web
            dockerfile: src/frontend/imova-web/Dockerfile
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: false
          # Only the web image uses it; the value compose builds with locally.
          build-args: NEXT_PUBLIC_API_URL=http://localhost:8080
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
