name: Deploy

# Production deploy, by hand: Actions → Deploy → Run workflow (from main). For the commit on main:
#   1. checks it's main and that CI passed on it;
#   2. builds the three images once, tagged with the commit (skipped if the registry has them);
#   3. Terraform plan + apply: shared (registry, DNS, email), then prod — refusing any plan that
#      deletes or replaces something unless "allow_destroy" is ticked;
#   4. points prod's apps at the new images (API first: it runs the migrations) and prints the
#      database restore point taken just before;
#   5. checks the site and the API answer.
# Signs in to Azure with OIDC (no stored passwords) as "imova-github-deploy", which trusts only this
# repo's "production" environment. One-time setup: infra/scripts/setup-cd.sh (infra/README.md,
# "Deploying from GitHub"). infra/scripts/deploy.sh still does the same by hand.
on:
  workflow_dispatch:
    inputs:
      what:
        description: What to deploy
        type: choice
        options:
          - everything
          - app
          - infrastructure
        default: everything
      allow_destroy:
        description: Let Terraform delete or replace resources (refused otherwise)
        type: boolean
        default: false

# One deploy at a time; a second one waits instead of cancelling the first.
concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read

env:
  ACR_NAME: acrimova
  RESOURCE_GROUP: rg-imova-prod
  SITE_URL: https://imova.md
  API_URL: https://api.imova.md

jobs:
  check:
    name: Checks
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - name: From main only
        if: github.ref != 'refs/heads/main'
        run: |
          echo "::error::Deploy runs from main only (this run is on ${GITHUB_REF_NAME})."
          exit 1
      - name: CI passed on this commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          passed=$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/ci.yml/runs?head_sha=${GITHUB_SHA}&status=success" --jq '.total_count')
          if [ "$passed" = "0" ]; then
            echo "::error::CI hasn't passed on ${GITHUB_SHA::12} yet. Wait for the CI run on main to finish green, then deploy."
            exit 1
          fi
      - id: tag
        run: echo "tag=${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"

  build:
    name: Image (${{ matrix.image }})
    needs: check
    if: inputs.what != 'infrastructure'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: true
      matrix:
        include:
          - image: api
            context: .
            dockerfile: src/backend/Imova.Api/Dockerfile
          - image: worker
            context: .
            dockerfile: src/backend/Imova.Worker/Dockerfile
          - image: web
            context: src/frontend/imova-web
            dockerfile: src/frontend/imova-web/Dockerfile
    steps:
      - uses: actions/checkout@v4
      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Registry
        id: registry
        env:
          TAG: ${{ needs.check.outputs.tag }}
        run: |
          echo "server=$(az acr show --name "$ACR_NAME" --query loginServer -o tsv)" >> "$GITHUB_OUTPUT"
          if az acr repository show --name "$ACR_NAME" --image "imova-${{ matrix.image }}:$TAG" --output none 2>/dev/null; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "imova-${{ matrix.image }}:$TAG is already in the registry — not rebuilt."
          fi
          az acr login --name "$ACR_NAME"
      - uses: docker/setup-buildx-action@v3
        if: steps.registry.outputs.exists != 'true'
      - uses: docker/build-push-action@v6
        if: steps.registry.outputs.exists != 'true'
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.registry.outputs.server }}/imova-${{ matrix.image }}:${{ needs.check.outputs.tag }}
          build-args: APP_VERSION=${{ needs.check.outputs.tag }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}

  infrastructure:
    name: Terraform (shared, prod)
    needs: [check, build]
    # After the images (a new app would be created with them); also when the build was skipped.
    if: >-
      always() && inputs.what != 'app' && needs.check.result == 'success' &&
      (needs.build.result == 'success' || needs.build.result == 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: 40
    environment: production
    permissions:
      contents: read
      id-token: write
    env:
      ARM_USE_OIDC: "true"
      ARM_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
      ARM_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      TF_IN_AUTOMATION: "true"
      ALLOW_DESTROY: ${{ inputs.allow_destroy }}
    steps:
      - uses: actions/checkout@v4
      # The Azure CLI too: binding a custom domain runs `az containerapp hostname bind`.
      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "~1.17"
          terraform_wrapper: false
      - name: Image tag
        env:
          BUILT: ${{ needs.build.result == 'success' && needs.check.outputs.tag || '' }}
        run: |
          # Only used if Terraform creates an app; otherwise the running image is kept.
          tag="$BUILT"
          if [ -z "$tag" ]; then
            tag=$(az containerapp show --name imova-api --resource-group "$RESOURCE_GROUP" \
              --query 'properties.template.containers[0].image' -o tsv | sed 's/.*://')
          fi
          echo "IMAGE_TAG=$tag" >> "$GITHUB_ENV"
      - name: Plan and apply
        working-directory: infra
        run: |
          for stack in shared envs/prod; do
            backend=$([ "$stack" = shared ] && echo ../backend.hcl || echo ../../backend.hcl)
            vars=()
            [ "$stack" = envs/prod ] && vars=(-var "image_tag=$IMAGE_TAG")

            echo "::group::$stack: init + plan"
            terraform -chdir="$stack" init -input=false -lockfile=readonly -backend-config="$backend"
            set +e
            terraform -chdir="$stack" plan -input=false -detailed-exitcode -out=tfplan "${vars[@]}"
            code=$?
            set -e
            echo "::endgroup::"
            [ "$code" = 1 ] && { echo "::error::terraform plan failed in $stack"; exit 1; }

            if [ "$code" = 0 ]; then
              echo "### $stack: no changes" >> "$GITHUB_STEP_SUMMARY"
              continue
            fi

            {
              echo "### $stack: changes"
              echo '```'
              terraform -chdir="$stack" show -no-color tfplan | grep -E '^\s*# |^Plan:' || true
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"

            removed=$(terraform -chdir="$stack" show -json tfplan \
              | jq '[.resource_changes[] | select(.change.actions | index("delete"))] | length')
            if [ "$removed" != 0 ] && [ "$ALLOW_DESTROY" != true ]; then
              echo "::error::The $stack plan deletes or replaces $removed resource(s) — see the summary. Run again with \"allow_destroy\" ticked if that's intended."
              exit 1
            fi

            echo "::group::$stack: apply"
            terraform -chdir="$stack" apply -input=false tfplan
            echo "::endgroup::"
          done

  release:
    name: Release to prod
    needs: [check, build, infrastructure]
    if: >-
      always() && needs.check.result == 'success' && needs.build.result == 'success' &&
      (needs.infrastructure.result == 'success' || needs.infrastructure.result == 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: production
      url: https://imova.md
    permissions:
      contents: read
      id-token: write
    env:
      TAG: ${{ needs.check.outputs.tag }}
    steps:
      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Point the apps at the new images
        run: |
          registry=$(az acr show --name "$ACR_NAME" --query loginServer -o tsv)
          # The way back from a bad migration (some are one-way): a point-in-time restore to just
          # before this release (docs/backup-restore.md). B1ms can't take on-demand backups.
          restore_point=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          {
            echo "### Release $TAG"
            echo "Database restore point before this release: \`$restore_point\` (UTC, restorable for 7 days — docs/backup-restore.md)"
          } >> "$GITHUB_STEP_SUMMARY"
          # The API first: it runs the database migrations the other two may depend on.
          for app in imova-api imova-worker imova-web; do
            echo "Updating $app to $TAG"
            az containerapp update --name "$app" --resource-group "$RESOURCE_GROUP" \
              --image "$registry/$app:$TAG" --output none
          done
      - name: The site and the API answer
        run: |
          # Prod may be asleep (scaled to zero): the first request wakes it, so allow a few minutes.
          check() {
            for attempt in $(seq 1 18); do
              status=$(curl -s -o /dev/null -w '%{http_code}' --max-time 30 "$1" || true)
              [ "$status" = 200 ] && { echo "$1 → 200"; return 0; }
              echo "$1 → $status, retrying ($attempt/18)"
              sleep 10
            done
            echo "::error::$1 didn't answer 200. If a migration failed, restore the database to the point above."
            return 1
          }
          check "$API_URL/health/ready"
          check "$SITE_URL/"
          echo "prod runs **$TAG**: $SITE_URL" >> "$GITHUB_STEP_SUMMARY"
