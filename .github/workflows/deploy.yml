name: Deploy

# Every green CI run on main ends here:
#   1. the commit's three images are built and pushed (automatically);
#   2. "Deploy to prod" waits for your approval (GitHub → the run → Review deployments → Approve),
#      then: Terraform plan + apply (shared, then prod — a plan that deletes or replaces something
#      is refused unless run by hand with "allow_destroy"), the apps moved to the new images (API
#      first: it runs the migrations; the database restore point is in the summary), and a check
#      that the site and the API answer.
# Not approving is fine: the next merge brings a newer run. By hand (Actions → Deploy → Run
# workflow, from main) for a redeploy, only the infrastructure, or allow_destroy.
#
# No stored passwords: GitHub's OIDC token. The images are pushed as "imova-github-build" (the
# "build" environment: push to the registry, nothing else); prod is changed as
# "imova-github-deploy" (the "production" environment, behind your approval). One-time setup:
# infra/scripts/setup-cd.sh (infra/README.md, "Deploying from GitHub").
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      what:
        description: What to deploy
        type: choice
        options:
          - everything
          - app
          - infrastructure
        default: everything
      allow_destroy:
        description: Let Terraform delete or replace resources (refused otherwise)
        type: boolean
        default: false

permissions:
  contents: read

env:
  ACR_NAME: acrimova
  RESOURCE_GROUP: rg-imova-prod
  SITE_URL: https://imova.md
  API_URL: https://api.imova.md

jobs:
  check:
    name: Checks
    # After CI: only a green run for a push to this repo's main — never a pull request (a fork's
    # branch can be called "main" too).
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
    outputs:
      sha: ${{ steps.commit.outputs.sha }}
      tag: ${{ steps.commit.outputs.tag }}
      what: ${{ steps.commit.outputs.what }}
    steps:
      - name: Commit and what to deploy
        id: commit
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
          WHAT: ${{ inputs.what || 'everything' }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then
            if [ "$GITHUB_REF" != refs/heads/main ]; then
              echo "::error::Deploy runs from main only (this run is on ${GITHUB_REF_NAME})."
              exit 1
            fi
            passed=$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/ci.yml/runs?head_sha=${SHA}&status=success" --jq '.total_count')
            if [ "$passed" = "0" ]; then
              echo "::error::CI hasn't passed on ${SHA::12} yet. When it does, this workflow starts by itself."
              exit 1
            fi
          fi
          {
            echo "sha=$SHA"
            echo "tag=${SHA::12}"
            echo "what=$WHAT"
          } >> "$GITHUB_OUTPUT"
          echo "Commit ${SHA::12}, deploying: $WHAT" >> "$GITHUB_STEP_SUMMARY"

  build:
    name: Image (${{ matrix.image }})
    needs: check
    if: needs.check.outputs.what != 'infrastructure'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: build
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: true
      matrix:
        include:
          - image: api
            context: .
            dockerfile: src/backend/Imova.Api/Dockerfile
          - image: worker
            context: .
            dockerfile: src/backend/Imova.Worker/Dockerfile
          - image: web
            context: src/frontend/imova-web
            dockerfile: src/frontend/imova-web/Dockerfile
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.check.outputs.sha }}
      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Registry
        id: registry
        env:
          TAG: ${{ needs.check.outputs.tag }}
        run: |
          echo "server=${ACR_NAME}.azurecr.io" >> "$GITHUB_OUTPUT"
          az acr login --name "$ACR_NAME"
          if docker manifest inspect "${ACR_NAME}.azurecr.io/imova-${{ matrix.image }}:$TAG" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "imova-${{ matrix.image }}:$TAG is already in the registry — not rebuilt."
          fi
      - uses: docker/setup-buildx-action@v3
        if: steps.registry.outputs.exists != 'true'
      - uses: docker/build-push-action@v6
        if: steps.registry.outputs.exists != 'true'
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.registry.outputs.server }}/imova-${{ matrix.image }}:${{ needs.check.outputs.tag }}
          build-args: APP_VERSION=${{ needs.check.outputs.tag }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}

  deploy:
    name: Deploy to prod
    needs: [check, build]
    # Also when the build was skipped (infrastructure only).
    if: >-
      always() && needs.check.result == 'success' &&
      (needs.build.result == 'success' || needs.build.result == 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # Waits here for your approval (the environment's required reviewer).
    environment:
      name: production
      url: https://imova.md
    # One deploy at a time; a newer one waits instead of interrupting it.
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    env:
      SHA: ${{ needs.check.outputs.sha }}
      TAG: ${{ needs.check.outputs.tag }}
      WHAT: ${{ needs.check.outputs.what }}
      ALLOW_DESTROY: ${{ inputs.allow_destroy || false }}
      ARM_USE_OIDC: "true"
      ARM_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
      ARM_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      TF_IN_AUTOMATION: "true"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.check.outputs.sha }}
      # Also for Terraform: binding a custom domain runs `az containerapp hostname bind`.
      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - uses: hashicorp/setup-terraform@v3
        if: env.WHAT != 'app'
        with:
          terraform_version: "~1.17"
          terraform_wrapper: false

      - name: Terraform (shared, then prod)
        if: env.WHAT != 'app'
        working-directory: infra
        run: |
          # The image tag only matters if Terraform creates an app; otherwise the running one stays.
          image_tag="$TAG"
          if [ "$WHAT" = infrastructure ]; then
            image_tag=$(az containerapp show --name imova-api --resource-group "$RESOURCE_GROUP" \
              --query 'properties.template.containers[0].image' -o tsv | sed 's/.*://')
          fi

          for stack in shared envs/prod; do
            backend=$([ "$stack" = shared ] && echo ../backend.hcl || echo ../../backend.hcl)
            vars=()
            [ "$stack" = envs/prod ] && vars=(-var "image_tag=$image_tag")

            echo "::group::$stack: init + plan"
            terraform -chdir="$stack" init -input=false -lockfile=readonly -backend-config="$backend"
            set +e
            terraform -chdir="$stack" plan -input=false -detailed-exitcode -out=tfplan "${vars[@]}"
            code=$?
            set -e
            echo "::endgroup::"
            [ "$code" = 1 ] && { echo "::error::terraform plan failed in $stack"; exit 1; }

            if [ "$code" = 0 ]; then
              echo "### $stack: no changes" >> "$GITHUB_STEP_SUMMARY"
              continue
            fi

            {
              echo "### $stack: changes"
              echo '```'
              terraform -chdir="$stack" show -no-color tfplan | grep -E '^\s*# |^Plan:' || true
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"

            removed=$(terraform -chdir="$stack" show -json tfplan \
              | jq '[.resource_changes[] | select(.change.actions | index("delete"))] | length')
            if [ "$removed" != 0 ] && [ "$ALLOW_DESTROY" != true ]; then
              echo "::error::The $stack plan deletes or replaces $removed resource(s) — see the summary. If that's intended: Actions → Deploy → Run workflow with \"allow_destroy\" ticked."
              exit 1
            fi

            echo "::group::$stack: apply"
            terraform -chdir="$stack" apply -input=false tfplan
            echo "::endgroup::"
          done

      - name: Point the apps at the new images
        if: env.WHAT != 'infrastructure'
        run: |
          # The way back from a bad migration (some are one-way): a point-in-time restore to just
          # before this release (docs/backup-restore.md). B1ms can't take on-demand backups.
          restore_point=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          {
            echo "### Release $TAG"
            echo "Database restore point before this release: \`$restore_point\` (UTC, restorable for 7 days — docs/backup-restore.md)"
          } >> "$GITHUB_STEP_SUMMARY"
          # The API first: it runs the database migrations the other two may depend on.
          for app in imova-api imova-worker imova-web; do
            echo "Updating $app to $TAG"
            az containerapp update --name "$app" --resource-group "$RESOURCE_GROUP" \
              --image "${ACR_NAME}.azurecr.io/$app:$TAG" --output none
          done

      - name: The site and the API answer
        if: env.WHAT != 'infrastructure'
        run: |
          # Prod may be asleep (scaled to zero): the first request wakes it, so allow a few minutes.
          check() {
            for attempt in $(seq 1 18); do
              status=$(curl -s -o /dev/null -w '%{http_code}' --max-time 30 "$1" || true)
              [ "$status" = 200 ] && { echo "$1 → 200"; return 0; }
              echo "$1 → $status, retrying ($attempt/18)"
              sleep 10
            done
            echo "::error::$1 didn't answer 200. If a migration failed, restore the database to the point above."
            return 1
          }
          check "$API_URL/health/ready"
          check "$SITE_URL/"
          echo "prod runs **$TAG**: $SITE_URL" >> "$GITHUB_STEP_SUMMARY"
