services:
  backend:
    build:
      context: ./src/backend/Imova.Api
    container_name: imova-backend
    ports:
      - "8080:8080"

  frontend:
    build:
      context: ./src/frontend/imova-web
    container_name: imova-frontend
    environment:
      API_URL: http://backend:8080
    ports:
      - "3000:3000"
    depends_on:
      - backend
