<!doctype html>
<html lang="ro">
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; }
    :root {
      --ground: #FAFAF8;
      --surface: #FFFFFF;
      --ink: #14181C;
      --ink-muted: #5B6472;
      --border: #E4E7E9;
      --accent: #1C5C4B;
    }
    body { margin: 0; background: var(--ground); }
    a { text-decoration: none; color: inherit; }
    h1, h2 { margin: 0; }
    p { margin: 0; }
    textarea, button, input { font: inherit; }

    .nav-link { font-size: 14px; font-weight: 500; color: var(--ink-muted); }
    .btn-primary { display: inline-flex; align-items: center; justify-content: center; gap: 8px; background: var(--accent); color: #FFFFFF; font-weight: 600; font-size: 14px; padding: 10px 18px; border-radius: 10px; border: 1px solid transparent; cursor: pointer; white-space: nowrap; }

    .filter-tab { border: none; background: transparent; cursor: pointer; padding: 6px 2px; font-size: 13px; font-weight: 500; border-bottom: 2px solid transparent; }

    .convo-row { display: flex; gap: 12px; align-items: flex-start; padding: 14px 16px; cursor: pointer; border-bottom: 1px solid var(--border); }
    .convo-row:hover { background: color-mix(in oklch, var(--accent) 4%, transparent); }
    .convo-row.active { background: color-mix(in oklch, var(--accent) 8%, transparent); }

    .bubble-in { background: var(--surface); border: 1px solid var(--border); border-radius: 14px 14px 14px 4px; padding: 10px 14px; font-size: 14px; line-height: 1.5; max-width: 74%; }
    .bubble-out { background: var(--accent); color: #FFFFFF; border-radius: 14px 14px 4px 14px; padding: 10px 14px; font-size: 14px; line-height: 1.5; max-width: 74%; }

    @media (max-width: 860px) {
      .container { padding-left: 16px !important; padding-right: 16px !important; }
      .main-nav { display: none !important; }
      .msg-split { flex-direction: column !important; height: auto !important; }
      .convo-list { width: 100% !important; max-height: 320px !important; border-right: none !important; border-bottom: 1px solid var(--border) !important; }
    }
  </style>
</helmet>
<div style="--accent: {{accent}}; width: 100%; min-height: 100vh; background: var(--ground); font-family: 'IBM Plex Sans', sans-serif; color: var(--ink); overflow-x: hidden;">

  <svg width="0" height="0" style="position: absolute;" aria-hidden="true">
    <defs>
      <symbol id="i-building" viewBox="0 0 24 24"><path d="M4 20V9.5L12 4l8 5.5V20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/><line x1="9.5" y1="20" x2="9.5" y2="14" stroke="currentColor" stroke-width="1.6"/><line x1="14.5" y1="20" x2="14.5" y2="14" stroke="currentColor" stroke-width="1.6"/><line x1="9.5" y1="14" x2="14.5" y2="14" stroke="currentColor" stroke-width="1.6"/></symbol>
      <symbol id="i-user" viewBox="0 0 24 24"><circle cx="12" cy="8.5" r="3.4" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M5 20c1.2-4 4-6 7-6s5.8 2 7 6" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></symbol>
      <symbol id="i-send" viewBox="0 0 24 24"><line x1="4" y1="20" x2="20" y2="4" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/><path d="M20 4 14 20l-3-6-6-3 15-7Z" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/></symbol>
    </defs>
  </svg>

  <header style="border-bottom: 1px solid var(--border); background: var(--surface);">
    <div class="container" style="max-width: 1200px; margin: 0 auto; padding: 18px 48px; display: flex; align-items: center; justify-content: space-between;">
      <a href="Main.dc.html" style="display: flex; align-items: center; gap: 8px;">
        <span style="width: 10px; height: 10px; border-radius: 3px; background: var(--accent); display: inline-block;"></span>
        <span style="font-family: 'Space Grotesk', sans-serif; font-weight: 700; font-size: 22px; letter-spacing: -0.02em;">imova</span>
      </a>
      <nav class="main-nav" style="display: flex; gap: 28px;">
        <a class="nav-link" href="SavedListings.dc.html">Anunțuri salvate</a>
        <a class="nav-link" href="OwnerDashboard.dc.html">Anunțurile mele</a>
        <a class="nav-link" style="color: var(--ink); font-weight: 600;" href="Messages.dc.html">Mesaje</a>
        <a class="nav-link" href="AccountSettings.dc.html">Cont</a>
      </nav>
    </div>
  </header>

  <main style="padding: 28px 48px 56px;">
    <div class="container" style="max-width: 1200px; margin: 0 auto;">
      <h1 style="font-family: 'Space Grotesk', sans-serif; font-weight: 700; font-size: 26px; letter-spacing: -0.01em; margin-bottom: 18px;">Mesaje</h1>

      <div class="msg-split" style="display: flex; height: 620px; border: 1px solid var(--border); border-radius: 16px; overflow: hidden; background: var(--surface);">
        <div class="convo-list" style="width: 340px; flex-shrink: 0; border-right: 1px solid var(--border); display: flex; flex-direction: column; overflow: hidden;">
          <div style="display: flex; gap: 18px; padding: 14px 16px 10px; border-bottom: 1px solid var(--border);">
            <sc-for list="{{filterTabs}}" as="t" hint-placeholder-count="2">
              <button type="button" class="filter-tab" onClick="{{t.click}}" style="color: {{t.color}}; border-color: {{t.border}};">{{t.label}}</button>
            </sc-for>
          </div>
          <div style="overflow-y: auto; flex: 1;">
            <sc-for list="{{conversations}}" as="c" hint-placeholder-count="5">
              <div class="{{c.rowClass}}" onClick="{{c.select}}">
                <div style="width: 40px; height: 40px; border-radius: 50%; background: color-mix(in oklch, var(--accent) 12%, var(--surface)); display: flex; align-items: center; justify-content: center; color: var(--accent); flex-shrink: 0;"><svg width="18" height="18"><use href="#i-user"></use></svg></div>
                <div style="flex: 1; min-width: 0;">
                  <div style="display: flex; justify-content: space-between; gap: 8px;">
                    <span style="font-size: 14px; font-weight: {{c.nameWeight}};">{{c.name}}</span>
                    <span style="font-size: 11px; color: var(--ink-muted); white-space: nowrap;">{{c.time}}</span>
                  </div>
                  <div style="font-size: 12px; color: var(--ink-muted); margin-top: 2px;">{{c.listingTitle}}</div>
                  <div style="font-size: 13px; color: var(--ink); margin-top: 4px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: {{c.previewWeight}};">{{c.preview}}</div>
                </div>
                <sc-if value="{{c.unread}}" hint-placeholder-val="{{false}}">
                  <span style="width: 8px; height: 8px; border-radius: 50%; background: var(--accent); flex-shrink: 0; margin-top: 6px;"></span>
                </sc-if>
              </div>
            </sc-for>
          </div>
        </div>

        <div style="flex: 1; display: flex; flex-direction: column; min-width: 0;">
          <div style="padding: 14px 20px; border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; gap: 12px;">
            <div>
              <div style="font-size: 15px; font-weight: 600;">{{active.name}}</div>
              <div style="font-size: 12px; color: var(--ink-muted);">{{active.listingTitle}}</div>
            </div>
            <a href="PropertyDetail.dc.html" style="font-size: 13px; font-weight: 500; color: var(--accent);">Vezi anunțul</a>
          </div>
          <div style="flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 12px;">
            <sc-for list="{{active.thread}}" as="m" hint-placeholder-count="3">
              <div style="display: flex; justify-content: {{m.align}};">
                <div class="{{m.bubbleClass}}">{{m.text}}</div>
              </div>
            </sc-for>
          </div>
          <div style="padding: 14px 16px; border-top: 1px solid var(--border); display: flex; gap: 10px; align-items: flex-end;">
            <textarea rows="1" placeholder="Scrie un mesaj..." style="flex: 1; resize: none; border: 1px solid var(--border); border-radius: 10px; padding: 10px 12px; font-size: 14px;"></textarea>
            <button type="button" class="btn-primary" aria-label="Trimite"><svg width="16" height="16"><use href="#i-send"></use></svg>Trimite</button>
          </div>
        </div>
      </div>
    </div>
  </main>

  <footer style="border-top: 1px solid var(--border); padding: 24px 48px;">
    <div class="container" style="max-width: 1200px; margin: 0 auto; font-size: 13px; color: var(--ink-muted); text-align: center;">© 2026 imova. Toate drepturile rezervate.</div>
  </footer>

</div>
</x-dc>
<script data-dc-script data-props='{"accent":{"editor":"color","default":"#1C5C4B","options":["#1C5C4B","#1D3557","#7A3B12","#4A4E69"]},"$preview":{"width":1280,"height":900}}'>
class Component extends DCLogic {
  renderVals() {
    const accent = this.props.accent ?? '#1C5C4B';
    const activeId = this.state.activeId ?? 'm1';
    const filter = this.state.filter ?? 'toate';

    const threads = {
      m1: [
        { from: 'them', text: 'Bună ziua! Apartamentul de pe str. Ismail mai este disponibil?' },
        { from: 'me', text: 'Bună ziua! Da, este disponibil.' },
        { from: 'them', text: 'Bună ziua, este disponibil pentru vizionare weekendul acesta?' }
      ],
      m2: [
        { from: 'them', text: 'Bună ziua, prețul este negociabil?' },
        { from: 'me', text: 'Da, prețul este negociabil în limita a 3%.' }
      ],
      m3: [
        { from: 'them', text: 'Ce documente sunt necesare pentru vizionare?' },
        { from: 'me', text: 'Doar un act de identitate, restul îl explicăm la fața locului.' },
        { from: 'them', text: 'Mulțumesc pentru informații!' }
      ],
      m4: [
        { from: 'them', text: 'Puteți trimite mai multe poze cu bucătăria?' }
      ],
      m5: [
        { from: 'me', text: 'Bună ziua! V-aș propune sâmbătă la ora 14:00 pentru vizionare.' },
        { from: 'them', text: 'Am rezervat vizionarea pentru sâmbătă, ora 14:00.' }
      ]
    };

    const rawConvos = [
      { id: 'm1', name: 'Ion V.', listingTitle: 'Apartament, 2 camere · Centru', preview: 'Bună ziua, este disponibil pentru vizionare weekendul acesta?', time: '10:24', unread: true },
      { id: 'm2', name: 'Agenția Nord Imobiliare', listingTitle: 'Apartament, 3 camere · Botanica', preview: 'Da, prețul este negociabil în limita a 3%.', time: 'Ieri', unread: false },
      { id: 'm3', name: 'Maria C.', listingTitle: 'Casă · Buiucani', preview: 'Mulțumesc pentru informații!', time: 'Ieri', unread: false },
      { id: 'm4', name: 'Victor P.', listingTitle: 'Apartament, 1 cameră · Râșcani', preview: 'Puteți trimite mai multe poze cu bucătăria?', time: 'Luni', unread: true },
      { id: 'm5', name: 'Elena R.', listingTitle: 'Apartament, 4 camere · Telecentru', preview: 'Am rezervat vizionarea pentru sâmbătă, ora 14:00.', time: '22 sept', unread: false }
    ];

    const filterDefs = [
      { id: 'toate', label: 'Toate' },
      { id: 'necitite', label: 'Necitite' }
    ];
    const filterTabs = filterDefs.map((d) => {
      const isActiveTab = d.id === filter;
      return {
        id: d.id,
        label: d.label,
        color: isActiveTab ? 'var(--ink)' : 'var(--ink-muted)',
        border: isActiveTab ? 'var(--accent)' : 'transparent',
        click: () => this.setState({ filter: d.id })
      };
    });

    const visibleConvos = filter === 'necitite' ? rawConvos.filter((c) => c.unread) : rawConvos;

    const conversations = visibleConvos.map((c) => {
      const isActiveRow = c.id === activeId;
      return {
        ...c,
        rowClass: isActiveRow ? 'convo-row active' : 'convo-row',
        nameWeight: c.unread ? '700' : '500',
        previewWeight: c.unread ? '600' : '400',
        select: () => this.setState({ activeId: c.id })
      };
    });

    const activeConvo = rawConvos.find((c) => c.id === activeId) || rawConvos[0];
    const thread = (threads[activeConvo.id] || []).map((m) => ({
      align: m.from === 'me' ? 'flex-end' : 'flex-start',
      bubbleClass: m.from === 'me' ? 'bubble-out' : 'bubble-in',
      text: m.text
    }));

    return {
      accent,
      filterTabs,
      conversations,
      active: { name: activeConvo.name, listingTitle: activeConvo.listingTitle, thread }
    };
  }
}
</script>
</body>
</html>
