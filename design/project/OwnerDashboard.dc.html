<!doctype html>
<html lang="ro">
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; }
    :root {
      --ground: #FAFAF8;
      --surface: #FFFFFF;
      --ink: #14181C;
      --ink-muted: #5B6472;
      --border: #E4E7E9;
      --accent: #1C5C4B;
      --amber: #92622A;
      --amber-bg: #F3E7D6;
    }
    body { margin: 0; background: var(--ground); }
    a { text-decoration: none; color: inherit; }
    h1, h2 { margin: 0; }
    p { margin: 0; }
    button { font: inherit; }

    .nav-link { font-size: 14px; font-weight: 500; color: var(--ink-muted); }
    .btn-primary { display: inline-flex; align-items: center; justify-content: center; gap: 8px; background: var(--accent); color: #FFFFFF; font-weight: 600; font-size: 14px; padding: 12px 22px; border-radius: 10px; border: 1px solid transparent; cursor: pointer; white-space: nowrap; }
    .btn-outline-sm { display: inline-flex; align-items: center; justify-content: center; gap: 6px; background: transparent; color: var(--ink); font-weight: 500; font-size: 13px; padding: 8px 14px; border-radius: 8px; border: 1px solid var(--border); cursor: pointer; white-space: nowrap; }
    .btn-outline-sm:hover { border-color: var(--ink); }

    .filter-tab { border: none; background: transparent; cursor: pointer; padding: 9px 4px; font-size: 14px; font-weight: 500; border-bottom: 2px solid transparent; }

    .mobile-menu-btn { display: none; }

    @media (max-width: 900px) {
      .container { padding-left: 20px !important; padding-right: 20px !important; }
      .main-nav { display: none !important; }
      .listing-row { flex-direction: column !important; align-items: flex-start !important; gap: 12px !important; }
      .listing-row-actions { width: 100% !important; justify-content: flex-start !important; }
    }
  </style>
</helmet>
<div style="--accent: {{accent}}; width: 100%; min-height: 100vh; background: var(--ground); font-family: 'IBM Plex Sans', sans-serif; color: var(--ink); overflow-x: hidden;">

  <svg width="0" height="0" style="position: absolute;" aria-hidden="true">
    <defs>
      <symbol id="i-building" viewBox="0 0 24 24"><path d="M4 20V9.5L12 4l8 5.5V20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/><line x1="9.5" y1="20" x2="9.5" y2="14" stroke="currentColor" stroke-width="1.6"/><line x1="14.5" y1="20" x2="14.5" y2="14" stroke="currentColor" stroke-width="1.6"/><line x1="9.5" y1="14" x2="14.5" y2="14" stroke="currentColor" stroke-width="1.6"/></symbol>
      <symbol id="i-edit" viewBox="0 0 24 24"><path d="M4 20l1-4.2L15.8 5A1.8 1.8 0 0 1 18.4 7.6L7.6 18.4 4 20Z" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/></symbol>
    </defs>
  </svg>

  <header style="border-bottom: 1px solid var(--border); background: var(--surface);">
    <div class="container" style="max-width: 1160px; margin: 0 auto; padding: 18px 48px; display: flex; align-items: center; justify-content: space-between;">
      <a href="Main.dc.html" style="display: flex; align-items: center; gap: 8px;">
        <span style="width: 10px; height: 10px; border-radius: 3px; background: var(--accent); display: inline-block;"></span>
        <span style="font-family: 'Space Grotesk', sans-serif; font-weight: 700; font-size: 22px; letter-spacing: -0.02em;">imova</span>
      </a>
      <nav class="main-nav" style="display: flex; gap: 28px;">
        <a class="nav-link" href="SearchResults.dc.html">Cumpără</a>
        <a class="nav-link" href="SavedListings.dc.html">Anunțuri salvate</a>
        <a class="nav-link" style="color: var(--ink); font-weight: 600;" href="OwnerDashboard.dc.html">Anunțurile mele</a>
        <a class="nav-link" href="Messages.dc.html">Mesaje</a>
        <a class="nav-link" href="AccountSettings.dc.html">Cont</a>
      </nav>
    </div>
  </header>

  <main style="padding: 40px 48px 72px;">
    <div class="container" style="max-width: 1160px; margin: 0 auto;">
      <div style="display: flex; align-items: flex-start; justify-content: space-between; gap: 16px; flex-wrap: wrap;">
        <div>
          <h1 style="font-family: 'Space Grotesk', sans-serif; font-weight: 700; font-size: 28px; letter-spacing: -0.01em;">Anunțurile mele</h1>
          <p style="margin-top: 6px; font-size: 15px; color: var(--ink-muted);">Gestionează-ți anunțurile publicate dintr-un singur loc.</p>
        </div>
        <a href="AddListing.dc.html" class="btn-primary">Adaugă un anunț nou</a>
      </div>

      <div style="display: flex; gap: 22px; border-bottom: 1px solid var(--border); margin-top: 28px;">
        <sc-for list="{{tabs}}" as="t" hint-placeholder-count="4">
          <button type="button" class="filter-tab" onClick="{{t.click}}" style="color: {{t.color}}; border-color: {{t.border}};">{{t.label}}</button>
        </sc-for>
      </div>

      <div style="display: flex; flex-direction: column; gap: 14px; margin-top: 22px;">
        <sc-for list="{{listings}}" as="item" hint-placeholder-count="5">
          <div class="listing-row" style="display: flex; align-items: center; gap: 18px; padding: 14px; border: 1px solid var(--border); border-radius: 14px; background: var(--surface);">
            <div style="width: 88px; height: 68px; flex-shrink: 0; border-radius: 10px; overflow: hidden; background: linear-gradient(160deg, color-mix(in oklch, var(--accent) 15%, var(--surface)), color-mix(in oklch, var(--accent) 3%, var(--surface))); display: flex; align-items: center; justify-content: center;">
              <svg width="24" height="24" style="color: color-mix(in oklch, var(--accent) 45%, var(--ink-muted)); opacity: .55;"><use href="#i-building"></use></svg>
            </div>
            <div style="flex: 1; min-width: 0;">
              <div style="font-size: 15px; font-weight: 500;">{{item.title}}</div>
              <div style="font-size: 13px; color: var(--ink-muted); margin-top: 2px;">{{item.location}}</div>
            </div>
            <div style="font-family: 'Space Grotesk', sans-serif; font-weight: 700; font-size: 16px; white-space: nowrap;">{{item.price}}</div>
            <span style="font-size: 12px; font-weight: 600; padding: 5px 12px; border-radius: 999px; white-space: nowrap; background: {{item.statusBg}}; color: {{item.statusColor}};">{{item.statusLabel}}</span>
            <div class="listing-row-actions" style="display: flex; gap: 8px;">
              <a href="EditListing.dc.html" class="btn-outline-sm"><svg width="14" height="14"><use href="#i-edit"></use></svg>Editează</a>
              <button type="button" class="btn-outline-sm" onClick="{{item.toggleActive}}">{{item.toggleLabel}}</button>
            </div>
          </div>
        </sc-for>
      </div>
    </div>
  </main>

  <footer style="border-top: 1px solid var(--border); padding: 24px 48px;">
    <div class="container" style="max-width: 1160px; margin: 0 auto; font-size: 13px; color: var(--ink-muted); text-align: center;">© 2026 imova. Toate drepturile rezervate.</div>
  </footer>

</div>
</x-dc>
<script data-dc-script data-props='{"accent":{"editor":"color","default":"#1C5C4B","options":["#1C5C4B","#1D3557","#7A3B12","#4A4E69"]},"$preview":{"width":1200,"height":900}}'>
class Component extends DCLogic {
  renderVals() {
    const accent = this.props.accent ?? '#1C5C4B';
    const filter = this.state.filter ?? 'toate';
    const overrides = this.state.statusOverride || {};

    const tabDefs = [
      { id: 'toate', label: 'Toate' },
      { id: 'activ', label: 'Active' },
      { id: 'verificare', label: 'La verificare' },
      { id: 'inactiv', label: 'Dezactivate' }
    ];
    const tabs = tabDefs.map((d) => {
      const active = d.id === filter;
      return {
        id: d.id,
        label: d.label,
        color: active ? 'var(--ink)' : 'var(--ink-muted)',
        border: active ? 'var(--accent)' : 'transparent',
        click: () => this.setState({ filter: d.id })
      };
    });

    const statusMeta = {
      activ: { label: 'Activ', bg: 'color-mix(in oklch, var(--accent) 12%, var(--surface))', color: 'var(--accent)' },
      verificare: { label: 'La verificare', bg: 'var(--amber-bg)', color: 'var(--amber)' },
      inactiv: { label: 'Dezactivat', bg: 'var(--ground)', color: 'var(--ink-muted)' }
    };

    const raw = [
      { id: 'd1', title: 'Apartament, 2 camere', location: 'Centru, Chișinău', price: '€68.500', status: 'activ' },
      { id: 'd2', title: 'Apartament, 3 camere', location: 'Botanica, Chișinău', price: '€82.000', status: 'activ' },
      { id: 'd3', title: 'Casă', location: 'Buiucani, Chișinău', price: '€165.000', status: 'verificare' },
      { id: 'd4', title: 'Apartament, 1 cameră', location: 'Râșcani, Chișinău', price: '€41.900', status: 'inactiv' },
      { id: 'd5', title: 'Apartament, 4 camere', location: 'Telecentru, Chișinău', price: '€118.000', status: 'activ' }
    ];

    const withStatus = raw.map((l) => ({ ...l, status: overrides[l.id] || l.status }));
    const filtered = filter === 'toate' ? withStatus : withStatus.filter((l) => l.status === filter);

    const listings = filtered.map((l) => {
      const meta = statusMeta[l.status];
      return {
        ...l,
        statusLabel: meta.label,
        statusBg: meta.bg,
        statusColor: meta.color,
        toggleLabel: l.status === 'inactiv' ? 'Activează' : 'Dezactivează',
        toggleActive: () => {
          const next = { ...(this.state.statusOverride || {}) };
          next[l.id] = l.status === 'inactiv' ? 'activ' : 'inactiv';
          this.setState({ statusOverride: next });
        }
      };
    });

    return { accent, tabs, listings };
  }
}
</script>
</body>
</html>
